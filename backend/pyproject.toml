[project]
name = "gerencia-backend"
version = "0.1.0"
description = "API do controle financeiro pessoal organizado pelo ciclo do salário"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "argon2-cffi",
    "email-validator",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# A pasta alembic/ do projeto não deve fazer o pacote alembic parecer código local.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
