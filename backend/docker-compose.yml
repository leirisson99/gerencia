services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gerencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gerencia}
      POSTGRES_DB: ${POSTGRES_DB:-gerencia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gerencia}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
