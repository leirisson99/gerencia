name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gerencia
          POSTGRES_PASSWORD: gerencia
          POSTGRES_DB: gerencia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerencia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gerencia:gerencia@localhost:5432/gerencia_test
      TEST_DATABASE_URL: postgresql+psycopg://gerencia:gerencia@localhost:5432/gerencia_test
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Testes
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.servico }}
          push: false
          tags: gerencia-${{ matrix.servico }}:ci
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
